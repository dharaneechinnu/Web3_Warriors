name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CI: build validation (catches broken code before deploying) ──
  ci:
    name: Validate Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Client dependencies
        working-directory: Client
        run: npm install --legacy-peer-deps

      - name: Build Client
        working-directory: Client
        env:
          CI: false
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  # ── CD: deploy to VPS only after CI passes ──
  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/Web3_Warriors

            # Save .env files before pull
            cp Server/.env /tmp/server_env_backup 2>/dev/null || true
            cp Client/.env /tmp/client_env_backup 2>/dev/null || true

            git fetch --all
            git reset --hard origin/main

            # Restore .env files after pull
            cp /tmp/server_env_backup Server/.env 2>/dev/null || true
            cp /tmp/client_env_backup Client/.env 2>/dev/null || true

            cd Server
            npm install
            npm install uuid@9 --save
            pm2 restart server

            cd ../Client
            npm install --legacy-peer-deps
            npm run build

            systemctl restart nginx