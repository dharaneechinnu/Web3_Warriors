name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend (Client)
        working-directory: Client
        run: |
          echo "Installing frontend dependencies"
          npm ci --legacy-peer-deps
          echo "Running build"
          npm run build

      - name: Upload built frontend to VPS
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "Client/build/*"
          target: "/var/www/frontend/"

      - name: Restart server & nginx on VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd /var/www/Web3_Warriors || exit 0
            # Restore env backups if present
            cp /tmp/server_env_backup Server/.env 2>/dev/null || true

            # Restart server process (pm2) if available
            if command -v pm2 >/dev/null 2>&1; then
              cd Server || exit 0
              npm install --omit=dev || true
              pm2 restart Server || pm2 start Server
            fi

            # Restart nginx (ignore failures)
            systemctl restart nginx || true