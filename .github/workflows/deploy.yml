name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
#  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        working-directory: Client
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Upload frontend build to VPS
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "Client/build/*"
          target: "/var/www/frontend/"

      - name: Restart server and nginx on VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd /var/www/Web3_Warriors || exit 0

            # Restore server env if a backup exists
            cp /tmp/server_env_backup Server/.env 2>/dev/null || true

            # Install server dependencies and restart process manager
            cd Server || exit 0
            npm install --omit=dev || true
            pm2 restart Server || pm2 start Server

            # Ensure nginx picks up new frontend files
            systemctl restart nginx || true