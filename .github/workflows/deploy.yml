name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/Web3_Warriors
            
            # Backup env files
            cp Server/.env /tmp/server_env_backup 2>/dev/null || true
            cp Client/.env /tmp/client_env_backup 2>/dev/null || true
            
            git fetch --all
            git reset --hard origin/main
            
            # Restore env files
            cp /tmp/server_env_backup Server/.env 2>/dev/null || true
            cp /tmp/client_env_backup Client/.env 2>/dev/null || true
            
            cd Server
            npm install
            pm2 restart Server
            
            cd ../Client
            npm install --legacy-peer-deps
            npm run build
            
            # Deploy frontend
            rm -rf /var/www/frontend/*
            cp -r build/* /var/www/frontend/
            
            systemctl restart nginx