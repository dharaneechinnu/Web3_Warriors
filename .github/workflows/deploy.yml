name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |

            set -e

            echo "Starting deployment..."

            cd /var/www/Web3_Warriors

            # Backup env files
            cp Server/.env /tmp/server_env_backup 2>/dev/null || true
            cp Client/.env /tmp/client_env_backup 2>/dev/null || true

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Restore env files
            cp /tmp/server_env_backup Server/.env 2>/dev/null || true
            cp /tmp/client_env_backup Client/.env 2>/dev/null || true

            echo "Installing backend dependencies..."
            cd Server
            npm install --production

            echo "Restarting backend with PM2..."
            pm2 restart Server || pm2 start index.js --name Server

            echo "Building frontend..."
            cd ../Client
            npm install --legacy-peer-deps
            npm run build

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "Deployment completed successfully!"