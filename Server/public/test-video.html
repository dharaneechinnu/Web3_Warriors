<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      background: #1a1a1a;
      color: #fff;
    }
    h1 { color: #8b5cf6; }
    video {
      width: 100%;
      max-width: 640px;
      border: 2px solid #8b5cf6;
      border-radius: 8px;
      background: #000;
    }
    .info {
      margin: 1rem 0;
      padding: 1rem;
      background: rgba(139, 92, 246, 0.1);
      border-radius: 8px;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .status {
      padding: 0.5rem;
      margin: 0.5rem 0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .success { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    a { color: #8b5cf6; }
  </style>
</head>
<body>
  <h1>🎬 Video Upload Test Page</h1>
  
  <div class="info">
    <h3>Testing Video URL:</h3>
    <code id="videoUrl">Loading...</code>
  </div>

  <div id="statusContainer"></div>

  <h3>Video Player:</h3>
  <video id="videoPlayer" controls preload="metadata">
    <source id="videoSource" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <div class="info" style="margin-top: 1rem;">
    <h3>Direct Link:</h3>
    <a id="directLink" href="" target="_blank">Open in new tab →</a>
  </div>

  <script>
    const videoUrl = 'http://localhost:3500/uploads/intros/intro_69a809b48ce401fe7141f91e_1772631298364.mp4';
    
    document.getElementById('videoUrl').textContent = videoUrl;
    document.getElementById('videoSource').src = videoUrl;
    document.getElementById('directLink').href = videoUrl;
    
    const video = document.getElementById('videoPlayer');
    const statusContainer = document.getElementById('statusContainer');
    
    function addStatus(message, isError = false) {
      const div = document.createElement('div');
      div.className = `status ${isError ? 'error' : 'success'}`;
      div.textContent = message;
      statusContainer.appendChild(div);
    }
    
    // Test fetch
    fetch(videoUrl, { method: 'HEAD' })
      .then(response => {
        if (response.ok) {
          addStatus(`✅ HEAD request successful (${response.status})`);
          addStatus(`📦 Content-Type: ${response.headers.get('content-type')}`);
          addStatus(`📏 Content-Length: ${(response.headers.get('content-length') / 1024 / 1024).toFixed(2)} MB`);
        } else {
          addStatus(`❌ HEAD request failed: ${response.status} ${response.statusText}`, true);
        }
      })
      .catch(err => {
        addStatus(`❌ Fetch error: ${err.message}`, true);
      });
    
    // Video events
    video.addEventListener('loadstart', () => addStatus('⏳ Video loading started...'));
    video.addEventListener('loadedmetadata', () => addStatus(`✅ Metadata loaded (duration: ${video.duration.toFixed(1)}s)`));
    video.addEventListener('canplay', () => addStatus('✅ Video can play'));
    video.addEventListener('error', (e) => {
      const error = video.error;
      let errorMsg = 'Unknown error';
      if (error) {
        switch (error.code) {
          case 1: errorMsg = 'MEDIA_ERR_ABORTED: Playback aborted'; break;
          case 2: errorMsg = 'MEDIA_ERR_NETWORK: Network error'; break;
          case 3: errorMsg = 'MEDIA_ERR_DECODE: Decoding error'; break;
          case 4: errorMsg = 'MEDIA_ERR_SRC_NOT_SUPPORTED: Format not supported'; break;
        }
      }
      addStatus(`❌ Video error: ${errorMsg}`, true);
    });
    
    // Force reload
    video.load();
  </script>
</body>
</html>
